spring:
  application:
    name: taskflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${SPRING_DATASOURCE_USERNAME:taskflow}
    password: ${SPRING_DATASOURCE_PASSWORD:taskflow}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

taskflow:
  jwt:
    secret: ${TASKFLOW_JWT_SECRET:change-me-in-local-development-only}
    expiration: ${TASKFLOW_JWT_EXPIRATION:PT2H}
